name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed
        with:
          go-version: "1.25.13"
          cache: true
      - name: Verify the module graph is committed and unchanged
        run: |
          go mod download
          go mod verify
          git diff --exit-code go.mod go.sum
      - name: Format, vet, test
        run: make check
      - name: Build every release platform
        run: make dist
      - name: Build the release SBOM with the pinned generator
        run: make sbom

  # The whole value proposition of this component is that a reader can enumerate what it can do.
  # These greps fail the build if that stops being true, so the claim cannot rot silently.
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Containment gates and negative probes
        run: scripts/verify-containment.sh . --self-test

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed
        with:
          go-version: "1.25.13"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
