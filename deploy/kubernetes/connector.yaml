# RetentionOps Connector on Kubernetes.
#
# One replica, on purpose. The connector runs one job at a time and consumes a job nonce
# exactly once; two replicas sharing a state volume would be correct but pointless, and two
# replicas with separate volumes would each accept the same job. Retention work is not
# latency-sensitive — the whole design is that it happens on a schedule, under an approval.
apiVersion: v1
kind: Namespace
metadata:
  name: retentionops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retentionops-connector
  namespace: retentionops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retentionops-connector
  namespace: retentionops
data:
  connector.yaml: |
    control_plane:
      url: https://connector.retentionops.ca
    identity:
      directory: /var/lib/retentionops/identity
    state:
      directory: /var/lib/retentionops/state
    telemetry:
      metrics_address: 0.0.0.0:9102
      log_format: json
    sources:
      4a9f2c11-6b3d-4e58-9f21-7c0a8d4e6b52:
        type: postgresql
        host: postgres.production.svc.cluster.local
        database: production
        tls:
          mode: verify-full
          ca_file: /etc/retentionops/certs/postgres-ca.pem
        reader:
          username: retentionops_reader
          password: { provider: file, ref: /etc/retentionops/secrets/reader-password }
        executor:
          username: retentionops_executor
          password: { provider: file, ref: /etc/retentionops/secrets/executor-password }
        safety:
          allowed_schemas: [application]
          require_approval: true
          drift:
            mode: bounded
            exact_match_below_rows: 1000
            max_basis_points: 50
            max_rows: 100
          max_delete_rows: 50000
          max_batch_size: 1000
          statement_timeout_seconds: 30
          lock_timeout_seconds: 5
          tables:
            - schema: application
              table: audit_logs
              actions: [inspect, delete]
              retention_columns: [created_at]
              max_delete_rows: 50000
              max_batch_size: 1000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retentionops-connector-state
  namespace: retentionops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: retentionops-connector
  namespace: retentionops
spec:
  serviceName: retentionops-connector
  replicas: 1
  selector:
    matchLabels: { app: retentionops-connector }
  template:
    metadata:
      labels: { app: retentionops-connector }
    spec:
      serviceAccountName: retentionops-connector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: connector
          # Pin the digest, not the tag. A tag can be moved; a digest cannot, and pinning it
          # is what turns "we verified this build" into "we run the build we verified".
          image: ghcr.io/solutions-optigm/retentionops-connector@sha256:REPLACE_ME
          args: ["run", "--config", "/etc/retentionops/connector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: metrics
              containerPort: 9102
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: config,  mountPath: /etc/retentionops,             readOnly: true }
            - { name: certs,   mountPath: /etc/retentionops/certs,       readOnly: true }
            - { name: secrets, mountPath: /etc/retentionops/secrets,     readOnly: true }
            - { name: state,   mountPath: /var/lib/retentionops }
      volumes:
        - name: config
          configMap: { name: retentionops-connector }
        - name: certs
          secret: { secretName: retentionops-postgres-ca }
        - name: secrets
          # 0400: the file provider refuses a credential file readable by group or other.
          secret: { secretName: retentionops-postgres-credentials, defaultMode: 0400 }
        - name: state
          persistentVolumeClaim: { claimName: retentionops-connector-state }
---
# Egress only. The connector needs the control plane, the database and DNS — nothing else,
# and nothing needs to reach it except your Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retentionops-connector
  namespace: retentionops
spec:
  podSelector:
    matchLabels: { app: retentionops-connector }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { name: monitoring }
      ports:
        - { protocol: TCP, port: 9102 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels: { name: production }
      ports:
        - { protocol: TCP, port: 5432 }
